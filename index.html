<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Revision</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        :root {
            --bg: #08090c;
            --panel: rgba(24, 24, 28, 0.62);
            --panel-strong: rgba(28, 28, 32, 0.74);
            --panel-soft: rgba(255, 255, 255, 0.055);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-soft: rgba(255, 255, 255, 0.08);
            --text: #f5f5f7;
            --text-soft: rgba(245, 245, 247, 0.88);
            --muted: rgba(245, 245, 247, 0.68);
            --dim: rgba(245, 245, 247, 0.48);
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.26);
            --shadow-soft: 0 10px 35px rgba(0, 0, 0, 0.18);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 17px;
            --radius-sm: 13px;
            --accent: #fff;
            --hover-bg: rgba(255, 255, 255, 0.11);
            --hover-fg: #fff;
            --hover-border: rgba(255, 255, 255, 0.2);
            --line: rgba(255, 255, 255, 0.11);
        }
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: radial-gradient(1000px 600px at 50% -10%, rgba(255, 255, 255, 0.085), transparent 60%),
                radial-gradient(800px 500px at 100% 30%, rgba(125, 125, 255, 0.055), transparent 65%),
                radial-gradient(700px 500px at 0% 60%, rgba(0, 180, 255, 0.035), transparent 65%),
                linear-gradient(180deg, #070709 0%, #050507 48%, #040406 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            letter-spacing: -0.012em;
            min-height: 100vh;
            transition: background 0.25s, color 0.25s;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.35), transparent 65%);
            opacity: 0.18;
        }
        button {
            font: inherit;
            cursor: pointer;
        }
        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== Navigation ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            min-height: 68px;
            background: rgba(20, 20, 23, 0.50) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.085) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14) !important;
            backdrop-filter: saturate(180%) blur(26px) !important;
            -webkit-backdrop-filter: saturate(180%) blur(26px) !important;
            transition: background .28s ease, border-color .28s ease, color .28s ease, box-shadow .28s ease;
        }
        .logo {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.045em;
            color: #fff;
            text-decoration: none;
            line-height: 1.15;
        }
        .logo span {
            display: block;
            font-size: 10.5px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 26px;
            align-items: center;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.22s;
            cursor: pointer;
            position: relative;
            letter-spacing: -0.01em;
        }
        .nav-links a:hover {
            color: #fff;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 1.5px;
            background: #fff !important;
            border-radius: 999px;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform .85s cubic-bezier(.16, 1, .3, 1), opacity .16s ease;
            will-change: transform;
        }
        .nav-links a:hover::after,
        .nav-links a.active::after {
            opacity: 1;
            transform: scaleX(1);
        }
        .nav-links a.active {
            color: #fff;
        }
        @media (max-width: 768px) {
            nav {
                padding: 14px 18px;
            }
            .nav-links {
                gap: 16px;
            }
            .logo {
                font-size: 18px;
            }
            .logo span {
                font-size: 9px;
            }
        }

        /* ===== Theme Toggle ===== */
        .theme-toggle {
            position: fixed;
            right: 24px;
            top: 82px;
            z-index: 100;
            padding: 9px 13px;
            border-radius: 999px;
            background: rgba(25, 25, 29, 0.62) !important;
            border: 1px solid rgba(255, 255, 255, 0.13) !important;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22) !important;
            backdrop-filter: saturate(180%) blur(22px) !important;
            -webkit-backdrop-filter: saturate(180%) blur(22px) !important;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .theme-toggle:hover {
            opacity: 0.85;
        }

        /* ===== Hero ===== */
        #hero {
            padding: 132px 20px 44px;
            text-align: center;
        }
        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--dim);
            font-weight: 600;
            margin-bottom: 16px;
            opacity: 0.74;
        }
        #hero h1 {
            font-size: clamp(44px, 6vw, 68px);
            line-height: 0.98;
            letter-spacing: -0.065em;
            margin: 0 0 14px;
            font-weight: 700;
            text-shadow: 0 4px 28px rgba(255, 255, 255, 0.06);
        }
        #hero h1 span {
            color: #f5f5f7 !important;
        }
        .subtitle {
            margin: 0 auto;
            color: rgba(245, 245, 247, 0.8);
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }
        .hero-philosophy {
            max-width: 840px;
            margin: 12px auto 0;
            color: rgba(245, 245, 247, 0.58);
            font-size: 12px;
            line-height: 1.7;
        }

        /* ===== Top Level Pills ===== */
        .top-area {
            position: sticky;
            top: 0;
            z-index: 49;
            padding: 10px 0;
            background: rgba(15, 15, 18, 0.48) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.04) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.075) !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            backdrop-filter: saturate(180%) blur(26px) !important;
            -webkit-backdrop-filter: saturate(180%) blur(26px) !important;
        }
        .level-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
        }
        .pill {
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.105);
            color: rgba(245, 245, 247, 0.7) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-weight: 650;
            transition: transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
        }
        .pill:hover:not(.active) {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.10) !important;
            border-color: rgba(255, 255, 255, 0.18) !important;
        }
        .pill.active {
            background: rgba(255, 255, 255, 0.93);
            border-color: rgba(255, 255, 255, 0.96);
            color: #111;
            box-shadow: 0 8px 26px rgba(255, 255, 255, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        /* ===== Main Layout ===== */
        .main {
            padding: 24px 0 64px;
            flex: 1;
        }
        .topic-shell {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        .topic-list,
        .detail {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.072), rgba(255, 255, 255, 0.045)) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: var(--radius-xl) !important;
            box-shadow: var(--shadow) !important;
            backdrop-filter: saturate(160%) blur(26px) !important;
            -webkit-backdrop-filter: saturate(160%) blur(26px) !important;
        }
        .topic-list {
            padding: 12px;
            position: sticky;
            top: 20px;
            box-shadow: var(--shadow-soft) !important;
        }
        .topic-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--dim);
            padding: 8px 10px 12px;
        }
        .topic-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(245, 245, 247, 0.68) !important;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.38;
            transition: transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topic-btn:hover:not(.active) {
            transform: translateX(2px);
            background: rgba(255, 255, 255, 0.085) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        .topic-btn.active {
            background: rgba(255, 255, 255, 0.10) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .detail {
            padding: 30px 32px;
            min-height: 400px;
        }
        .detail h2 {
            font-size: 32px;
            line-height: 1.08;
            margin: 0 0 18px;
            letter-spacing: -0.045em;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
        }
        .detail h2:hover {
            opacity: 0.8;
        }
        .empty {
            padding: 48px 20px;
            color: var(--dim);
            text-align: center;
            font-size: 13px;
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.035);
            color: var(--muted);
            font-size: 12px;
            padding: 7px 10px;
            margin: 0 0 15px -10px;
            border-radius: 999px;
            transition: .2s;
        }
        .back:hover {
            background: rgba(255, 255, 255, 0.09) !important;
            border-color: rgba(255, 255, 255, 0.13) !important;
            color: #fff !important;
        }

        /* ===== Content Sections ===== */
        .section {
            margin-top: 24px;
            padding: 18px;
            border: 1px solid var(--glass-border-soft) !important;
            border-radius: var(--radius-lg) !important;
            background: rgba(255, 255, 255, 0.035) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 28px rgba(0, 0, 0, 0.08);
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.075);
            color: var(--text);
        }
        .section-note {
            color: var(--muted);
            font-size: 12px;
            margin: -2px 0 10px;
            line-height: 1.5;
        }

        /* ===== Tables ===== */
        .table-wrap {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.09) !important;
            border-radius: var(--radius-md) !important;
            background: rgba(255, 255, 255, 0.025) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
        }
        .data-table th,
        .data-table td {
            padding: 13px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            vertical-align: top;
            text-align: left;
            line-height: 1.5;
            font-size: 13px;
        }
        .data-table th {
            color: rgba(245, 245, 247, 0.62);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.055) !important;
            font-weight: 650;
        }
        .data-table td:first-child {
            font-weight: 600;
            color: var(--text);
        }
        .data-table td:last-child {
            color: var(--muted);
        }
        .data-table tr:last-child td {
            border-bottom: 0;
        }

        /* ===== Unified Content Tables ===== */
        .vocab-grid{display:block}
        .content-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(255,255,255,.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
        .content-table th,.content-table td{padding:12px 14px;overflow-wrap:anywhere;word-break:normal;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top;text-align:left;line-height:1.5;font-size:13px}
        .content-table th{color:rgba(245,245,247,.62);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.055);font-weight:700}
        .content-table tbody tr:last-child td{border-bottom:0}
        .content-table tbody tr{transition:background .16s ease}
        .content-table tbody tr:hover{background:rgba(255,255,255,.045)}
        .content-table .col-primary{color:var(--text);font-weight:650}
        .content-table .col-secondary{color:var(--muted)}
        .content-table .col-tertiary{color:var(--text-soft)}
        .content-table .click-sentence{cursor:pointer;transition:opacity .16s ease}
        .content-table .click-sentence:hover{opacity:.76}
        .content-caption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
        .content-caption-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
        .content-caption-note{font-size:11px;color:var(--dim)}
        .grammar-intro{margin:0 0 14px;color:var(--text-soft);font-size:13px;line-height:1.7}
        .grammar-block{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.075)}
        .grammar-block:first-child{margin-top:0;padding-top:0;border-top:0}
        .grammar-block h4{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
        .grammar-block p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.65}
        .speaking-table th:first-child,.speaking-table td:first-child{width:50%}
        .speaking-table td,.speaking-table th{font-size:13px}
        .speaking-table .de-line{color:var(--text);font-weight:550;cursor:pointer}
        .speaking-table .en-line{color:var(--muted)}
        .speaking-table tbody tr:hover .de-line{opacity:.78}
        body.light .content-table{border-color:rgba(60,60,67,.10);background:rgba(255,255,255,.40);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 8px 22px rgba(25,25,35,.035)}
        body.light .content-table th{background:rgba(60,60,67,.045);color:rgba(29,29,31,.56)}
        body.light .content-table td{border-bottom-color:rgba(60,60,67,.075)}
        body.light .content-table tbody tr:hover{background:rgba(60,60,67,.035)}
        body.light .grammar-block{border-top-color:rgba(60,60,67,.09)}
        body.light .grammar-intro{color:rgba(29,29,31,.75)}
        @media(max-width:620px){
            .content-table{border-radius:15px}
            .content-table th,.content-table td{font-size:11px;padding:9px 8px}
            .content-table th{font-size:9.5px}
            .speaking-table td,.speaking-table th{font-size:11px}
            .content-caption{align-items:flex-start;flex-direction:column;gap:2px}
        }

        .grammar-category{display:inline-flex;align-items:center;margin:0 0 9px;padding:6px 10px;border:1px solid var(--glass-border-soft);border-radius:999px;background:rgba(255,255,255,.035);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
        .grammar-intro{max-width:760px;margin:0 0 16px;color:var(--text-soft);font-size:13px;line-height:1.72}
        .topic-group-label{padding:12px 10px 5px;color:var(--dim);font-size:9.5px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
        .topic-group-label:first-child{padding-top:5px}
        body.light .grammar-category{background:rgba(255,255,255,.52);border-color:rgba(60,60,67,.10);color:rgba(29,29,31,.55)}
        body.light .topic-group-label{color:rgba(29,29,31,.43)}

        .vocab-table th:nth-child(1){width:25%}.vocab-table th:nth-child(2){width:21%}.vocab-table th:nth-child(3){width:54%}
        .vocab-table td.col-primary{font-weight:650}.vocab-table td.col-tertiary{color:var(--text-soft)}
        .vocab-table .vocab-emoji{display:inline-block;width:1.45em;margin-right:2px}
        @media(max-width:620px){.vocab-table th:nth-child(1){width:30%}.vocab-table th:nth-child(2){width:22%}.vocab-table th:nth-child(3){width:48%}}
        /* ===== Polished grammar layout ===== */
        .grammar-category{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px}
        .grammar-explanation{margin:0 0 20px;padding:15px 16px;border:1px solid var(--glass-border-soft);border-radius:var(--radius-md);background:rgba(255,255,255,.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
        .grammar-explanation-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--dim);margin-bottom:7px}
        .grammar-explanation p{margin:0;color:var(--text-soft);font-size:13.5px;line-height:1.72}
        .grammar-why-label{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--dim)}
        .grammar-explanation .grammar-why{margin-top:4px;color:var(--muted);font-size:12.5px}
        body.light .grammar-why-label{border-top-color:rgba(60,60,67,.08);color:rgba(29,29,31,.44)}
        body.light .grammar-explanation .grammar-why{color:rgba(29,29,31,.60)}
        .grammar-table-section{margin:0 0 20px}
        .grammar-table-title{font-size:14px;font-weight:750;color:var(--text);margin:0 0 9px;letter-spacing:-.015em}
        .grammar-table-wrap{border-radius:14px}
        .grammar-table{min-width:0}
        .grammar-table th,.grammar-table td{font-size:12.5px}
        .grammar-table td:first-child{font-weight:650}
        .grammar-example-cell{cursor:pointer}
        .grammar-tip{margin-top:4px;padding:13px 15px;border:1px solid var(--glass-border-soft);border-radius:13px;background:rgba(255,255,255,.045);color:var(--text-soft);font-size:12.5px;line-height:1.65}
        .vocab-inline-emoji{display:inline-block;margin-right:5px;font-size:1.05em;vertical-align:-.06em}
        body.light .grammar-explanation,body.light .grammar-tip{background:rgba(255,255,255,.48);border-color:rgba(60,60,67,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
        body.light .grammar-explanation-label,body.light .grammar-category{color:rgba(29,29,31,.46)}
        body.light .grammar-explanation p,body.light .grammar-tip{color:rgba(29,29,31,.74)}
        @media(max-width:620px){.grammar-table th,.grammar-table td{font-size:11px;padding:9px 7px}.grammar-explanation{padding:13px 14px}.grammar-table-title{font-size:13px}}

        /* ===== Footer ===== */
        footer {
            padding: 28px 0 48px;
            margin-top: auto;
            flex-shrink: 0;
            text-align: center;
            color: rgba(245, 245, 247, 0.43);
            font-size: 11px;
        }

        /* ===== Light Mode ===== */
        body.light {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-soft: rgba(29, 29, 31, 0.88);
            --muted: rgba(29, 29, 31, 0.62);
            --dim: rgba(29, 29, 31, 0.43);
            --glass-border: rgba(60, 60, 67, 0.13);
            --glass-border-soft: rgba(60, 60, 67, 0.08);
            --shadow: 0 24px 70px rgba(25, 25, 35, 0.10);
            --shadow-soft: 0 12px 35px rgba(25, 25, 35, 0.07);
            --line: rgba(60, 60, 67, 0.10);
            --hover-bg: rgba(0, 0, 0, 0.045);
            --hover-fg: #1d1d1f;
            --hover-border: rgba(0, 0, 0, 0.12);
            background: radial-gradient(1000px 580px at 50% -10%, rgba(255, 255, 255, 0.92), transparent 62%),
                radial-gradient(700px 450px at 100% 30%, rgba(180, 190, 255, 0.18), transparent 70%),
                radial-gradient(650px 480px at 0% 55%, rgba(160, 220, 255, 0.12), transparent 72%),
                linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 52%, #eef0f3 100%);
            color: var(--text);

        function esc(s) { return String(s).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;',
                '"': '&quot;' }[c])); }

        // ----- Speech -----
        function speak(text) {
            const txt = String(text || '').trim();
            if (!txt) return;
            const synth = window.speechSynthesis;
            if (!synth || typeof window.SpeechSynthesisUtterance !== 'function') return;
            try {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'de-DE';
                u.rate = 0.88;
                u.pitch = 1;
                const voices = synth.getVoices ? synth.getVoices() : [];
                const deVoice = voices.find(v => /^de(-|_)/i.test(v.lang)) || voices.find(v => /german|deutsch/i.test(v.name ||
                    ''));
                if (deVoice) u.voice = deVoice;
                synth.speak(u);
            } catch (err) { console.warn('Speech error:', err); }
        }

        function vocabType(raw){
            const rawStr=String(raw||'').trim();
            const lower=rawStr.toLowerCase();
            if (VOCAB_QUESTION_WORDS.has(lower)) return 'Fragewörter';
            if (VOCAB_PRONOUNS.has(rawStr) || VOCAB_PRONOUNS.has(lower)) return 'Pronomen';
            if (VOCAB_NUMBERS.has(lower)) return 'Zahlen';
            if (/^(der|die|das)\s+/i.test(rawStr) && !/(\bputzen\b|\bfahren\b|\bgehen\b|\bkommen\b|\bmachen\b|\bsein\b|\bhaben\b|\bschreiben\b|\blesen\b|\bsprechen\b|\btrinken\b|\bessen\b|\bspielen\b)$/i.test(rawStr)) return 'Nomen';
            if (VOCAB_ADJECTIVES.has(lower)) return 'Adjektive';
            if (VOCAB_OTHER_VERBS.has(lower)) return 'Verben';
            if (/^(sich\s+)?[a-zäöüß]+(en|ern|eln)$/i.test(rawStr)) return 'Verben';
            return 'Weitere Wörter';
        }

        function boldTarget(sentence, rawTerm){
            const sentenceText = String(sentence || '');
            const raw = String(rawTerm || '').trim();
            if (!raw) return esc(sentenceText);
            const variants = [];
            const add = value => {
                const v = String(value || '').trim();
                if (v && !variants.includes(v)) variants.push(v);
            };
            add(raw);
            raw.split(' / ').forEach(add);
            raw.split('/').forEach(v => add(v));
            const articleFree = raw.replace(/^(der|die|das)\s+/i, '').trim();
            add(articleFree);
            articleFree.split(' / ').forEach(add);
            articleFree.split('/').forEach(v => add(v));
            variants.sort((a,b) => b.length - a.length);
            const escaped = variants.map(v => v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
            if (!escaped) return esc(sentenceText);
            const re = new RegExp(`(${escaped})`,'giu');
            let out='', last=0, m;
            while ((m=re.exec(sentenceText))!==null){
                out += esc(sentenceText.slice(last,m.index));
                out += '<strong>' + esc(m[0]) + '</strong>';
                last = m.index + m[0].length;
            }
            if (!out) return esc(sentenceText);
            out += esc(sentenceText.slice(last));
            return out;
        }

        // ----- Render Grammar -----
        function grammarWhy(title){
            const t=String(title||'').toLowerCase();
            if(t.includes('regelmäßige verben')) return 'This pattern covers a large number of everyday A1 verbs. Once you know the endings, you can conjugate many new regular verbs without memorising every form separately.';
            if(t.includes('unregelmäßige verben')) return 'These verbs appear constantly in everyday German. Their forms are common enough that recognising them quickly is more useful than trying to force them into the regular pattern.';
            if(t.includes('modalverben')) return 'Modal verbs are essential for saying what you can, must, may, want, should or would like to do. Their sentence structure is therefore one of the most useful A1 patterns.';
            if(t.includes('nominativ')) return 'The nominative helps you identify the subject and choose the correct article. It is the starting point for building simple German sentences.';
            if(t.includes('akkusativ')) return 'The accusative lets you identify the direct object. At A1, the visible masculine change is especially important: der → den and ein → einen.';
            if(t.includes('dativ')) return 'The dative is important for indirect objects and many location expressions. Recognising the dative helps you understand both articles and common preposition patterns.';
            if(t.includes('hauptsatz')) return 'Verb position is one of the key rules of German sentence building. Keeping the conjugated verb in position 2 makes your main clauses clear and natural.';
            if(t.includes('fragen')) return 'Questions are essential for everyday communication. Learning the two basic patterns gives you a reliable structure for asking for information and checking facts.';
            if(t.includes('präpositionen')) return 'Location prepositions make your meaning precise. At A1, learning them together with the dative pattern is much easier than memorising isolated words.';
            if(t.includes('personalpronomen')) return 'Personal pronouns are the foundation of verb conjugation. Once you know who is doing the action, the correct verb form becomes much easier to choose.';
            if(t.includes('possessivpronomen')) return 'Possessive pronouns are used constantly when talking about family, people and personal things. Learning the masculine/neuter versus feminine/plural pattern gives you a strong A1 base.';
            return 'This pattern is part of the core A1 grammar you need to understand and produce simple German sentences with confidence.';
        }

                        <h3 class="grammar-table-title">${esc(t.title || 'Tabelle')}</h3>
                        <div class="table-wrap grammar-table-wrap">
                            <table class="content-table grammar-table" aria-label="${esc(t.title || g.title)}">
                                <thead><tr>${(t.headers || []).map(h => `<th>${esc(String(h).replace(/\*\*/g,''))}</th>`).join('')}</tr></thead>
                                <tbody>${(t.rows || []).map(row => `<tr>${row.map((cell, ci) => `<td class="${ci===0 ? 'col-primary' : 'col-tertiary'} ${ci>0 ? 'grammar-example-cell click-sentence speakable' : ''}" ${ci>0 ? `onclick='speak(${JSON.stringify(String(cell))})'` : ''}>${esc(String(cell).replace(/\*\*/g,''))}</td>`).join('')}</tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </section>
                `).join('')}
                ${g.tip ? `<div class="grammar-tip">${esc(g.tip.replace(/\*\*/g,''))}</div>` : ''}
            `;
            window.scrollTo({ top: document.querySelector('.detail').offsetTop - 80, behavior: 'smooth' });
        }

        // ----- Render Speaking -----
        function renderSpeakingTopic(index) {
            currentTopic = index;
            const d = SPEAKING_DATA[index];
            if (!d) {
                document.getElementById('detail').innerHTML = '<div class="empty">Dialog nicht gefunden.</div>';
                return;
            }
            renderTopicList();
            const panel = document.getElementById('detail');
            const lines = d.lines || [];
            const fullText = lines.map(l => l[0]).join(' ');
            panel.innerHTML = `
                <button class="back" onclick="renderSpeakingTopic(${Math.max(0, index-1)})">←</button>
                <h2>${esc(d.title)}</h2>
                <div class="content-caption">
                    <span class="content-caption-title">Dialog</span>
                    <span class="content-caption-note">Deutsch · Englisch</span>
                </div>
                <div class="table-wrap">
                    <table class="content-table speaking-table" aria-label="${esc(d.title)}">
                        <thead><tr><th>Deutsch</th><th>Englisch</th></tr></thead>
                        <tbody>
                            ${lines.map(line => `
                                <tr>
                                    <td class="de-line click-sentence speakable" onclick='speak(${JSON.stringify(line[0])})'>${esc(line[0])}</td>
                                    <td class="en-line">${esc(line[1] || '')}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            window.scrollTo({ top: document.querySelector('.detail').offsetTop - 80, behavior: 'smooth' });
        }

        // ----- Render Topic List (Sidebar) -----
        
        function grammarGroupFor(grammar) {
            return grammar.category || '🧩 Weitere Grammatik';
        }

        function renderTopicList() {
            const container = document.getElementById('topicButtons');
            const label = document.getElementById('topicLabel');
            if (!container || !label) return;
            if (currentSection === 'vokabular') {
                label.textContent = 'Vokabular · Kategorien';
                container.innerHTML = VOCAB_DATA.map((cat, i) =>
                    `<button class="topic-btn ${i === currentTopic ? 'active' : ''}" onclick="renderVocabTopic(${i})">${esc(String(cat.label))}</button>`
                ).join('');
            } else if (currentSection === 'grammatik') {
                label.textContent = 'Grammatik · Themen';
                let out = '';
                let lastGroup = '';
                GRAMMAR_DATA.forEach((g, i) => {
                    const group = grammarGroupFor(g);
                    if (group !== lastGroup) {
                        out += `<div class="topic-group-label">${esc(group)}</div>`;
                        lastGroup = group;
                    }
                    out += `<button class="topic-btn ${i === currentTopic ? 'active' : ''}" onclick="renderGrammarTopic(${i})">${esc(g.title)}</button>`;
                });
                container.innerHTML = out;
            } else if (currentSection === 'sprechen') {
                label.textContent = 'Sprechen · Dialoge';
                container.innerHTML = SPEAKING_DATA.map((d, i) =>
                    `<button class="topic-btn ${i === currentTopic ? 'active' : ''}" onclick="renderSpeakingTopic(${i})">${esc(String(d.title))}</button>`
                ).join('');
            }
        }

        // ----- Set Section -----
        function setSection(section) {
            currentSection = section;
            currentTopic = 0;
            document.querySelectorAll('.pill').forEach(p => {
                p.classList.toggle('active', p.dataset.section === section);
                if (document.body.classList.contains('light')) {
                    p.style.background = 'transparent';
                    p.style.boxShadow = 'none';
                    p.style.borderColor = 'transparent';
                    p.style.color = p.classList.contains('active') ? '#1d1d1f' : 'rgba(29,29,31,.62)';
                    p.style.fontWeight = p.classList.contains('active') ? '700' : '650';
                }
            });
            renderTopicList();
            if (section === 'vokabular') renderVocabTopic(0);
            else if (section === 'grammatik') renderGrammarTopic(0);
            else if (section === 'sprechen') renderSpeakingTopic(0);
        }

        // ====================================================================
        // INIT
        // ====================================================================

        document.addEventListener('DOMContentLoaded', function() {
            // Theme toggle
            const themeToggle = document.getElementById('themeToggle');
            function applyTheme(light) {
                document.body.classList.toggle('light', light);
                themeToggle.textContent = light ? '☾ Dunkel' : '☀︎ Hell';
                document.querySelectorAll('.pill').forEach(p => {
                    if (light) {
                        p.style.background = 'transparent';
                        p.style.boxShadow = 'none';
                        p.style.borderColor = 'transparent';
                        p.style.color = p.classList.contains('active') ? '#1d1d1f' : 'rgba(29,29,31,.62)';
                        p.style.fontWeight = p.classList.contains('active') ? '700' : '650';
                    } else {
                        p.style.removeProperty('background');
                        p.style.removeProperty('box-shadow');
                        p.style.removeProperty('border-color');
                        p.style.removeProperty('color');
                        p.style.removeProperty('font-weight');
                    }
                });
                try { localStorage.setItem('a1-revision-theme', light ? 'light' : 'dark'); } catch (_) {}
            }
            let savedTheme = null;
            try { savedTheme = localStorage.getItem('a1-revision-theme'); } catch (_) {}
            applyTheme(savedTheme === 'light');
            themeToggle.addEventListener('click', () => applyTheme(!document.body.classList.contains('light')));

            // Pills
            document.querySelectorAll('.pill').forEach(p => {
                p.addEventListener('click', () => setSection(p.dataset.section));
            });

            // Start
            setSection('vokabular');

            // Voice readiness
            if ('speechSynthesis' in window) {
                speechSynthesis.addEventListener('voiceschanged', () => {});
            }

            console.log('A1 Revision ready. 🎯');
        });
    </script>
</body>
</html>
